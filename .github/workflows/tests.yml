name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0dev0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Init test-inputs submodule over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive src/stanalyzer/tests/inputs
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.73.0
          cache: true
      - name: Smoke test
        run: pixi run smoke
      - name: Run test suite
        run: pixi run test
        timeout-minutes: 30
      # Optional analysis tools (dssp/freesasa/hole2):
      # - dssp + freesasa install on all pixi platforms (secondary structure, SASA).
      # - mdahole2 is a pure-Python PyPI dep (hole analysis wrapper).
      # - hole2 is linux-64 only: no osx-arm64 build upstream (osmart/hole2#3),
      #   so on macos-14 the hole tests skip; on ubuntu all 6 run.
      # The deps are already locked in pixi.lock; this step just installs them.
      - name: Enable optional tools
        run: pixi install --locked
