[workspace]
name = "stanalyzer"
description = "Command-line and web interface for common simulation trajectory analysis"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
mdanalysis = ">=2.7"
invoke = ">=2.2"
pyyaml = ">=6.0"
fastapi = ">=0.115"
uvicorn = ">=0.32"
jinja2 = ">=3.1"
sqlmodel = ">=0.0.22"
email-validator = ">=2.2"
python-multipart = ">=0.0.17"
psutil = ">=7.0"
bracex = ">=2.0"
# numpy <2: numpy 2.5.x eig returns complex128 (breaks helix_tilt)
numpy = ">=1.26.4,<2"
scipy = "*"
matplotlib = "*"
# Optional analysis tools (secondary structure, SASA) — available on all platforms.
dssp = ">=4.6"
freesasa = ">=2.2.1"

[pypi-dependencies]
stanalyzer = { path = ".", editable = true }
# kmedoids (FasterPAM); sklearn_extra unmaintained, py3.12-broken (distutils)
kmedoids = ">=0.5.5, <0.6"
# mdahole2: pure-Python HOLE wrapper (hole analysis)
mdahole2 = ">=0.5.0"

[tasks]
smoke = "stanalyzer -h && stanalyzer -l"
test = { cmd = "python -m unittest -b", cwd = "src/stanalyzer/tests" }

# Dockerized linux-64 testing (mirrors CI's ubuntu runner).
# One-time env build:  pixi run docker-install
# Full linux-64 suite: pixi run docker-test
# Narrow run:          pixi run docker-test test_cli.CholTilt test_cli.CovAnalysis
docker-sync = "rsync -a --delete --exclude .git --exclude .pixi --exclude .pixi-home --exclude .docker-test ./ .docker-test/"

docker-install = { cmd = "docker run --rm --platform linux/amd64 -v \"$(pwd)/.docker-test:/work\" ghcr.io/prefix-dev/pixi:latest bash /work/src/stanalyzer/tests/install_env.sh", depends-on = ["docker-sync"] }

docker-test = { cmd = "docker run --rm --platform linux/amd64 -v \"$(pwd)/.docker-test:/work\" ghcr.io/prefix-dev/pixi:latest bash /work/src/stanalyzer/tests/run_test.sh", depends-on = ["docker-install"] }

# Optional analysis tools:
# - dssp + freesasa install on all pixi platforms (secondary structure, SASA).
# - mdahole2 is a pure-Python PyPI dep (hole analysis wrapper).
# - hole2 is linux-64 only: no osx-arm64 build upstream (osmart/hole2#3),
#   so hole tests skip on macOS by design.
# - libmcfp <2.0.5: dssp 4.6.1 (linux-64) needs mcfp::config::get_last_option_ref,
#   removed in libmcfp 2.0.5+ (mkdssp dies with "undefined symbol" otherwise).
[target.linux-64.dependencies]
hole2 = ">=2.3"
libmcfp = ">=2.0.1,<2.0.5"
